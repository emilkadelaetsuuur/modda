# Lex Monitor, scoped to nasa.cartify.ink
map $uri $lex_media_request_key {
    default "";
    ~^/api/monitor/(media-upload|youtube-preview|youtube-search|live-search|demo)$ $binary_remote_addr;
}
limit_req_zone $lex_media_request_key zone=lex_media_requests:1m rate=6r/m;
server {
    listen 80;
    listen [::]:80;
    server_name nasa.cartify.ink;
    root /var/www/nasa.cartify.ink;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://nasa.cartify.ink$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nasa.cartify.ink;
    ssl_certificate /etc/letsencrypt/live/nasa.cartify.ink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nasa.cartify.ink/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 49m;
    gzip on;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml text/plain;
    gzip_min_length 1024;
    add_header Strict-Transport-Security "max-age=2592000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=()" always;

    location = /studio { return 302 /studio/; }
    location ^~ /studio/ {
        client_max_body_size 181m;
        proxy_pass http://127.0.0.1:18883;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_read_timeout 420s;
        proxy_send_timeout 420s;
    }
    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-store";
        return 200 "self.addEventListener('install', e=>e.waitUntil(self.skipWaiting()));self.addEventListener('activate',e=>e.waitUntil(self.registration.unregister()));";
    }
    # Lex search (lex-search.service), вставляется в server { listen 443 … } сайта nasa.cartify.ink перед «location / {»
    location = /qidiruv { return 301 /qidiruv/; }
    location ^~ /qidiruv/ {
        proxy_pass http://127.0.0.1:18390/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location ^~ /brand/ { alias /var/www/nasa.cartify.ink/brand/; expires 7d; }
    location / {
        limit_req zone=lex_media_requests burst=12 nodelay;
        proxy_pass http://127.0.0.1:18881;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 420s;
        proxy_send_timeout 180s;
    }
}
