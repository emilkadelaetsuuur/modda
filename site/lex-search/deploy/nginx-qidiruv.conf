    # Lex search (lex-search.service), вставляется в server { listen 443 … } сайта nasa.cartify.ink перед «location / {»
    location = /qidiruv { return 301 /qidiruv/; }
    location ^~ /qidiruv/ {
        proxy_pass http://127.0.0.1:18390/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
