# Форматы под возраст. Попадают в промпт сценариста и в параметры сборки.
# duration: целевая длина ролика, shots: сколько шотов, wps: слов в секунду речи,
# caption_scale: размер субтитров, tts_speed: множитель скорости озвучки, music: настроение бита,
# style: стиль картинки по умолчанию, rules: правила текста для сценариста.

kids:
  label: "Дети 7-11"
  duration: 30
  shots: [8, 10]
  wps: 2.0
  caption_scale: 1.1
  tts_speed: 0.95
  music: kids
  style: kids_soft
  characters: [sardor, abror]
  rules: |
    - Пиши короткими фразами по 4-7 слов. Только простые слова, которые знает ребёнок 8 лет.
    - Никаких терминов: вместо "административная ответственность" говори "штраф", вместо "несовершеннолетний" говори "ребёнок".
    - Один главный вывод на ролик. Повтори его в конце другими словами.
    - Никаких страшных сцен: без огня крупно, без травм, без полиции с наручниками.
    - Сардор ошибается, Аброр по-доброму объясняет. Ребёнок должен узнать себя в Сардоре.
    - Финал: что делать правильно (зелёным).

teens:
  label: "Подростки 12-17"
  duration: 30
  shots: [9, 12]
  wps: 2.6
  caption_scale: 1.0
  tts_speed: 1.05
  music: upbeat
  style: bright
  characters: [abror, malika]
  rules: |
    - Хук в первые 2 секунды: ситуация, которая случается с подростками (соцсети, петарды, самокат, деньги, учёба).
    - Быстрый темп, шот 2-4 секунды, каждая реплика короткая и живая.
    - Говорим на "ты", без морали и без канцелярита. Можно лёгкий юмор.
    - Обязательно цифра последствий (штраф, срок) и чем это грозит лично зрителю или родителям.
    - Финал: что МОЖНО, чтобы не было ощущения одних запретов.

adults:
  label: "Взрослые 18-55"
  duration: 35
  shots: [9, 12]
  wps: 2.5
  caption_scale: 1.0
  tts_speed: 1.0
  music: upbeat
  style: bright
  characters: [abror, nodira, officer]
  rules: |
    - Практика: что изменилось, с какой даты, сколько стоит нарушение, как обжаловать.
    - Указывай номер закона и статьи так, как они написаны в тексте (их проверит фактчекер).
    - Суммы штрафов давай и в БРВ, и в сумах, если в тексте закона есть БРВ (1 БРВ задан в config).
    - Хук: бытовая ситуация или популярный миф ("говорят, что...").
    - Финал: одно действие, которое зритель может сделать сегодня.

elderly:
  label: "Пожилые 55+"
  duration: 40
  shots: [7, 9]
  wps: 2.0
  caption_scale: 1.25
  tts_speed: 0.9
  music: calm
  style: elder_clear
  characters: [bobo, nodira]
  rules: |
    - Спокойный темп, шот 4-6 секунд, без резких вспышек.
    - Уважительное обращение на "вы". Короткие ясные предложения.
    - Объясняй, где проверить информацию: lex.uz, махалля, госуслуги, телефон доверия.
    - Если тема про мошенников и фейки: прямо скажи, что ни один орган не просит перевести деньги или назвать код из СМС.
    - Финал: что сказать или сделать (позвонить детям, проверить на lex.uz).
