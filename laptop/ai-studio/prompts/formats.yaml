# Типы роликов. Попадают в промпт сценариста. structure: скелет по шотам.

explainer:
  label: "Познавательный: новый закон простыми словами"
  structure: |
    1. ХУК (0-2 c): яркая ситуация-нарушение крупно. Рассказчик или герой одной фразой.
    2. РЕАКЦИЯ: герой эмоционально реагирует ("Эй! Вы что творите?!").
    3. СТАВКА: цена ошибки (штраф/риск) одной цифрой.
    4. ЧТО ЗАПРЕЩЕНО: перечисление предметов или действий (вид сверху, крупно).
    5. С КАКОГО ЧИСЛА: дата вступления в силу, название закона.
    6. НАКАЗАНИЕ: точная формулировка из закона в простых словах.
    7. ЧТО МОЖНО: позитивная альтернатива.
    8. КТО ОТВЕЧАЕТ / КУДА ОБРАЩАТЬСЯ.
    9. ФИНАЛ: герой с улыбкой, призыв, плашка источника lex.uz.

refute:
  label: "Опровержение фейка"
  structure: |
    1. ХУК: "В сети пишут, что ..." (пересказ фейка своими словами, без имени автора и без скриншота).
    2. Герой: удивление или сомнение.
    3. БОЛЬШАЯ ПЛАШКА "ФЕЙК" или "НЕПРАВДА" (красным).
    4. Что на самом деле написано в законе (дата, номер, статья).
    5. Почему фейк опасен лично зрителю (деньги, штраф, паника).
    6. Как проверить самому: lex.uz, официальный канал органа.
    7. ФИНАЛ: "Проверяй на lex.uz", плашка источника.
  rules: |
    - Никогда не называй автора фейка, не показывай его аккаунт и лицо.
    - Не повторяй фейк дословно больше одного раза, сразу давай правду.
    - Добавь в JSON поле "fake": пересказ фейка одной фразой (цифры из него фактчекер не считает ошибкой).
    - Реплика с фейком: emotion "question" или "surprised", субтитр красным, sfx "buzz" на плашке ФЕЙК.

myth_fact:
  label: "Миф или правда? (3 мифа подряд)"
  structure: |
    1. ХУК: "Три мифа о ... , в которые верит каждый второй".
    2-3. Миф 1: формулировка (красным) -> правда из закона (зелёным).
    4-5. Миф 2.
    6-7. Миф 3.
    8. ФИНАЛ: проверяй на lex.uz.

quick_rule:
  label: "Правило за 15 секунд"
  structure: |
    1. ХУК-вопрос (0-2 c).
    2. Ответ из закона одной фразой с цифрой.
    3. Что можно вместо этого.
    4. Плашка источника.

dialog_scene:
  label: "Сценка-диалог двух героев"
  structure: |
    1. Герой А делает ошибку в бытовой ситуации.
    2. Герой Б останавливает: "Стой! Ты знаешь, что...?"
    3-6. Короткий диалог: вопрос -> ответ по закону -> уточнение -> цифра.
    7. Рассказчик подводит итог одной фразой.
    8. Финал: оба делают правильно.

quiz:
  label: "Тест: угадай ответ"
  structure: |
    1. ХУК: "Сможешь ответить? 3 секунды!"
    2. Вопрос с вариантами А / Б (субтитрами).
    3. Пауза-тикание 2 секунды (sfx: tick).
    4. Правильный ответ (зелёным, sfx: ding) + объяснение по закону.
    5. Повторить для второго вопроса.
    6. Финал: "Сколько угадал? Пиши в комментариях".
